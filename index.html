<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Page Mini Store</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
        header { background: #f57224; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; cursor: pointer; }
        nav button { background: white; color: #f57224; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .page { display: none; }
        .active { display: block; }

        /* Store Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-body { padding: 10px; }
        .card-title { font-size: 14px; font-weight: 600; height: 36px; overflow: hidden; margin-bottom: 5px; }
        .card-price { color: #f57224; font-size: 16px; font-weight: bold; }

        /* Product View */
        .detail-box { background: white; padding: 20px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 20px; }
        .detail-img { max-width: 320px; width: 100%; border-radius: 8px; }
        .detail-info { flex: 1; }
        .btn-buy { background: #f57224; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* Forms */
        .form-card { background: white; padding: 20px; border-radius: 8px; max-width: 450px; margin: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1 onclick="navigate('#/')">🛍️ ExpressStore</h1>
    <nav>
        <button onclick="navigate('#/admin')">+ Add Product (Admin)</button>
    </nav>
</header>

<div class="container">

    <!-- PAGE 1: MAIN STORE -->
    <div id="home-page" class="page">
        <h2>Flash Sale Products</h2>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- PAGE 2: PRODUCT VIEW -->
    <div id="product-page" class="page">
        <button onclick="navigate('#/')">← Back to Store</button>
        <br><br>
        <div class="detail-box">
            <img id="viewImg" src="" class="detail-img">
            <div class="detail-info">
                <h2 id="viewTitle"></h2>
                <div class="card-price" id="viewPrice" style="font-size: 22px;"></div>
                <p id="viewDesc" style="color: #666; margin-top: 15px;"></p>
                <button class="btn-buy" onclick="goToCheckout()">BUY NOW</button>
            </div>
        </div>
    </div>

    <!-- PAGE 3: CHECKOUT -->
    <div id="checkout-page" class="page">
        <button onclick="window.history.back()">← Back</button>
        <br><br>
        <div class="form-card">
            <h3>Place Order</h3>
            <p id="orderProductTitle" style="font-weight: bold; color: #f57224;"></p>
            <form id="orderForm">
                <input type="hidden" id="orderProductName" name="productName">
                <input type="hidden" id="orderSaleAmount" name="saleAmount">
                
                <div class="form-group">
                    <label>නම (Name)*</label>
                    <input type="text" name="customerName" required>
                </div>
                <div class="form-group">
                    <label>ලිපිනය (Address)*</label>
                    <input type="text" name="address" required>
                </div>
                <div class="form-group">
                    <label>නගරය (City)*</label>
                    <input type="text" name="city" required>
                </div>
                <div class="form-group">
                    <label>දුරකථන අංකය (Phone)*</label>
                    <input type="tel" name="phone1" required>
                </div>
                <button type="submit" class="btn-submit" id="subBtn">Confirm Order (COD)</button>
            </form>
            <div id="msg" style="text-align:center; margin-top:10px; font-weight:bold;"></div>
        </div>
    </div>

    <!-- PAGE 4: ADMIN -->
    <div id="admin-page" class="page">
        <button onclick="navigate('#/')">← Back to Store</button>
        <br><br>
        <div class="form-card">
            <h3>Admin Panel - Add Product</h3>
            <form id="adminForm">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="adminName" required>
                </div>
                <div class="form-group">
                    <label>Price (Rs.)</label>
                    <input type="number" id="adminPrice" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="adminImg" placeholder="https://..." required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="adminDesc" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn-submit" style="background:#2980b9;">Save Product</button>
            </form>
        </div>
    </div>

</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyVnuI1o4galwTSdetYBlgXsIjztQs_XakqQrWtcZuIx-no2ypUSwELhTLVbuNrOAkf/exec';
    
    let products = [
        { id: '1', name: 'Mini Portable Rechargeable Fan', price: 2850, img: 'https://images.unsplash.com/photo-1585338107529-13afc5f02586?w=500', desc: 'High quality rechargeable mini fan with 3 speed modes.' },
        { id: '2', name: 'Munchee Hawaiian Cookies 200g', price: 182, img: 'https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=500', desc: 'Delicious Hawaiian coconut flavored crispy cookies.' }
    ];

    let currentSelectedProduct = null;

    function navigate(hash) {
        window.location.hash = hash;
    }

    function handleRouting() {
        const hash = window.location.hash || '#/';
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

        if (hash === '#/' || hash === '') {
            renderProducts();
            document.getElementById('home-page').classList.add('active');
        } 
        else if (hash.startsWith('#/product/')) {
            const prodId = hash.split('#/product/')[1];
            currentSelectedProduct = products.find(p => p.id === prodId);
            if (currentSelectedProduct) {
                document.getElementById('viewImg').src = currentSelectedProduct.img;
                document.getElementById('viewTitle').innerText = currentSelectedProduct.name;
                document.getElementById('viewPrice').innerText = 'Rs. ' + currentSelectedProduct.price;
                document.getElementById('viewDesc').innerText = currentSelectedProduct.desc;
                document.getElementById('product-page').classList.add('active');
            } else {
                navigate('#/');
            }
        } 
        else if (hash.startsWith('#/checkout')) {
            if (!currentSelectedProduct) {
                navigate('#/');
                return;
            }
            document.getElementById('orderProductTitle').innerText = currentSelectedProduct.name + ' - Rs. ' + currentSelectedProduct.price;
            document.getElementById('orderProductName').value = currentSelectedProduct.name;
            document.getElementById('orderSaleAmount').value = currentSelectedProduct.price;
            document.getElementById('checkout-page').classList.add('active');
        } 
        else if (hash === '#/admin') {
            document.getElementById('admin-page').classList.add('active');
        }
    }

    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        products.forEach(p => {
            grid.innerHTML += `
                <div class="card" onclick="navigate('#/product/${p.id}')">
                    <img src="${p.img}">
                    <div class="card-body">
                        <div class="card-title">${p.name}</div>
                        <div class="card-price">Rs. ${p.price}</div>
                    </div>
                </div>
            `;
        });
    }

    function goToCheckout() {
        if (currentSelectedProduct) {
            navigate('#/checkout/' + currentSelectedProduct.id);
        }
    }

    // Submit Order to Google Sheet
    document.getElementById('orderForm').addEventListener('submit', e => {
        e.preventDefault();
        const subBtn = document.getElementById('subBtn');
        const msg = document.getElementById('msg');
        subBtn.disabled = true;
        msg.innerText = 'Processing Order...';

        const data = Object.fromEntries(new FormData(e.target).entries());

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            msg.style.color = 'green';
            msg.innerText = 'Order Successful!';
            e.target.reset();
            subBtn.disabled = false;
        })
        .catch(() => {
            msg.style.color = 'red';
            msg.innerText = 'Error placing order.';
            subBtn.disabled = false;
        });
    });

    // Admin Add Product
    document.getElementById('adminForm').addEventListener('submit', e => {
        e.preventDefault();
        const newProd = {
            id: Date.now().toString(),
            name: document.getElementById('adminName').value,
            price: document.getElementById('adminPrice').value,
            img: document.getElementById('adminImg').value,
            desc: document.getElementById('adminDesc').value
        };
        products.push(newProd);
        alert('Product Added Successfully!');
        e.target.reset();
        navigate('#/');
    });

    window.addEventListener('hashchange', handleRouting);
    window.addEventListener('load', handleRouting);
</script>

</body>
</html>
