<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Fan Store - Order Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
    .form-container { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { color: #1a252f; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
    .header p { color: #7f8c8d; font-size: 14px; margin-top: 5px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #333; font-size: 14px; }
    input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; transition: 0.3s; }
    input:focus, textarea:focus, select:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
    button { width: 100%; background-color: #27ae60; color: white; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    button:hover { background-color: #219150; }
    .status-msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; display: none; }
    .success { color: #27ae60; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>

<div class="form-container">
  <div class="header">
    <h2>Main Fan Store</h2>
    <p>කරුණාකර ඔබගේ ඇණවුම් විස්තර ඇතුළත් කරන්න</p>
  </div>

  <form id="orderForm">
    <div class="form-group">
      <label>පාරිභෝගිකයාගේ නම (Customer Name):</label>
      <input type="text" name="Name" required placeholder="ඔබගේ සම්පූර්ණ නම">
    </div>

    <div class="form-group">
      <label>ලිපිනය (Delivery Address):</label>
      <textarea name="Address" rows="3" required placeholder="ඇණවුම එවිය යුතු ලිපිනය"></textarea>
    </div>

    <div class="form-group">
      <label>නගරය (City):</label>
      <input type="text" name="City" required placeholder="ළඟම නගරය">
    </div>

    <div class="form-group">
      <label>දුරකථන අංකය 1 (Phone 1):</label>
      <input type="tel" name="Phone" required pattern="[0-9]{10}" placeholder="07XXXXXXXX">
    </div>

    <div class="form-group">
      <label>දුරකථන අංකය 2 (Phone 2 - Optional):</label>
      <input type="tel" name="Phone2" pattern="[0-9]{10}" placeholder="07XXXXXXXX">
    </div>

    <div class="form-group">
      <label>භාණ්ඩයේ නම / විස්තරය (Product):</label>
      <input type="text" name="Product" required placeholder="Fan Model / Quantity">
    </div>

    <button type="submit" id="submitBtn">Submit Order</button>
  </form>

  <div id="statusMsg" class="status-msg"></div>
</div>

<script>
  // ඔබගේ Google Apps Script Web App URL එක මෙතැනට යොදන්න
  const scriptURL = 'https://script.google.com/macros/s/AKfycbzp-PG0eARp1RHbmrppFHkGe4r8Qi5NNyC3TZqtz66cER0oq4ZPi9mzoTvKXBRaw1Uf/exec';
  
  const form = document.getElementById('orderForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', e => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = 'Submitting Order...';
    statusMsg.style.display = 'none';

    fetch(scriptURL, { method: 'POST', body: new FormData(form) })
      .then(response => {
        statusMsg.className = 'status-msg success';
        statusMsg.innerText = 'ඇණවුම සාර්ථකව යොමු කෙරිණි! (Order Placed Successfully)';
        statusMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Order';
        form.reset();
      })
      .catch(error => {
        statusMsg.className = 'status-msg error';
        statusMsg.innerText = 'ඇණවුම යැවීමට නොහැකි විය. නැවත උත්සාහ කරන්න.';
        statusMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Order';
      });
  });
</script>

</body>
</html>
